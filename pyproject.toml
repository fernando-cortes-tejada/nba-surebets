[project]
name = "nba-surebets"
version = "1.0.0"
description = "Cross-sportsbook arbitrage finder for NBA markets"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "requests>=2.31"]

[project.optional-dependencies]
scrape = ["selenium>=4.15"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["surebets*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
