# Local deployment: Airflow (LocalExecutor) + Postgres. Secrets come from .env.
x-airflow: &airflow
  build: .
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    SUREBETS_DATA_DIR: /opt/airflow/data
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./data:/opt/airflow/data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow  # local-only database, not exposed
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5

  airflow-init:
    <<: *airflow
    command: bash -c "airflow db migrate && airflow users create --role Admin --username admin --password admin --firstname a --lastname a --email admin@example.com || true"

  scheduler:
    <<: *airflow
    command: scheduler
    restart: always

  webserver:
    <<: *airflow
    command: webserver
    ports:
      - "8080:8080"
    restart: always

volumes:
  postgres-db:
